<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laluan Batu Caves</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#183153;
}


/* =========================
   HEADER
========================= */

.header{
  background:#123f7a;
  padding:14px 30px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  color:white;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:90px;
  height:90px;
  flex-shrink:0;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.brand-title{
  font-size:21px;
  font-weight:bold;
}

.brand-subtitle{
  font-size:13px;
  color:#dbe7f5;
}

.header-note{
  text-align:right;
  font-size:14px;
  font-weight:600;
}

.running-date,
.last-update{
  line-height:1.4;
}


/* =========================
   MAIN
========================= */

.main{
  padding:25px 30px;
}

.card{
  background:white;

  border:1px solid #e5eaf1;
  border-radius:12px;

  box-shadow:0 2px 10px rgba(0,0,0,.05);

  overflow:hidden;
}


/* =========================
   TITLE
========================= */

.topbar{
  padding:20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
}

.title{
  font-size:21px;
  font-weight:bold;
  color:#173f7a;
}

.search{
  width:310px;

  padding:11px 14px;

  border:1px solid #d8dfeb;
  border-radius:9px;

  outline:none;

  font-size:13px;
}

.search:focus{
  border-color:#3470dc;
}


/* =========================
   FILTER
========================= */

.tabs{
  padding:0 20px 15px;

  display:flex;
  gap:8px;
}

.tab{
  border:1px solid #d5deec;

  background:white;

  padding:8px 16px;

  border-radius:9px;

  color:#284d80;

  font-weight:600;

  cursor:pointer;
}

.tab:hover{
  background:#f5f8fd;
}

.tab.active{
  background:#173f7a;
  color:white;

  border-color:#173f7a;
}


/* =========================
   INFO
========================= */

.table-info{
  display:flex;
  justify-content:space-between;

  padding:0 20px 15px;

  font-size:13px;

  color:#64748b;
}


/* =========================
   TABLE
========================= */

.table-container{
  overflow:auto;
  max-height:650px;
}

table{
  width:100%;
  border-collapse:collapse;

  min-width:1050px;
}

thead{
  background:#f5f8fc;

  position:sticky;
  top:0;

  z-index:2;
}

th{
  padding:12px;

  text-align:left;

  font-size:12px;

  color:#52627a;

  border-top:1px solid #e5eaf2;
  border-bottom:1px solid #e5eaf2;

  white-space:nowrap;
}

td{
  padding:13px 12px;

  border-bottom:1px solid #e8edf4;

  font-size:13px;

  vertical-align:middle;
}

.route{
  font-weight:bold;
  color:#16458d;
}


/* =========================
   BADGE
========================= */

.badge{
  display:inline-block;

  padding:5px 9px;

  border-radius:7px;

  font-size:11px;

  font-weight:bold;
}

.rkl{
  background:#edf3ff;
  color:#2662c4;
}

.rod{
  background:#eef8f5;
  color:#07855d;
}

.os{
  background:#fff4e8;
  color:#b56800;
}


/* =========================
   VALUES
========================= */

.value{
  font-weight:600;
  font-size:14px;
}


/* =========================
   EDIT
========================= */

.number-input{
  width:65px;

  padding:7px 8px;

  border:1px solid #b9c9e3;

  border-radius:7px;

  text-align:center;

  font-size:13px;

  outline:none;
}

.number-input:focus{
  border-color:#2d68d8;
}

.action{
  padding:7px 11px;

  border:1px solid #b8ccec;

  background:white;

  color:#1850a5;

  border-radius:8px;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;
}

.action:hover{
  background:#f2f6ff;
}

.save{
  background:#173f7a;
  color:white;

  border-color:#173f7a;
}

.cancel{
  color:#64748b;

  border-color:#d5deec;

  margin-left:5px;
}


/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  padding:20px;

  font-size:12px;

  color:#6b7280;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .header{
    padding:15px 18px;
  }

  .main{
    padding:15px 18px;
  }

  .header-note{
    display:none;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .search{
    width:100%;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="brand">

    <div class="logo">

      <img
        src="./logo-batu-caves.jpg.jpeg"
        alt="Depot Batu Caves"
      >

    </div>


    <div>

      <div class="brand-title">
        Rapid Bus Batu Caves
      </div>

      <div class="brand-subtitle">
        Senarai Perkhidmatan Laluan
      </div>

    </div>

  </div>


  <div class="header-note">

    <div class="running-date">
      📅 <span id="runningDate"></span>
    </div>

    <div class="last-update">
      Last Update:
      <span id="lastUpdate">-</span>
    </div>

  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">

<div class="card">


  <!-- TITLE -->

  <div class="topbar">

    <div class="title">
      LALUAN BATU CAVES
    </div>


    <input
      id="search"
      class="search"
      type="text"
      placeholder="Cari route / origin / destination..."
      oninput="updateView()"
    >

  </div>



  <!-- FILTER -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="filterRoutes('ALL',this)"
    >
      SEMUA
    </button>


    <button
      class="tab"
      onclick="filterRoutes('RKL',this)"
    >
      RKL
    </button>


    <button
      class="tab"
      onclick="filterRoutes('ROD',this)"
    >
      ROD
    </button>


    <button
      class="tab"
      onclick="filterRoutes('OS',this)"
    >
      OS
    </button>

  </div>



  <!-- INFO -->

  <div class="table-info">

    <span>
      Senarai laluan
    </span>

    <span id="routeCount">
      44 laluan
    </span>

  </div>



  <!-- TABLE -->

  <div class="table-container">

    <table>

      <thead>

        <tr>

          <th>NO.</th>
          <th>ROUTE</th>
          <th>ORIGIN</th>
          <th>DESTINATION</th>
          <th>TYPE</th>
          <th>LOS</th>
          <th>PP</th>
          <th>AC</th>
          <th>UPDATE</th>

        </tr>

      </thead>


      <tbody id="routeTable"></tbody>

    </table>

  </div>

</div>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

  Disediakan oleh Nur Izzahti binti Azeman (10022552)

</footer>



<script>


/* =========================
   STORAGE
========================= */

const STORAGE_KEY = "bcv-route-data";


/* =========================
   ROUTE DATA
========================= */

const routes = [

  ["151","BANDAR BARU SELAYANG","HAB LEBUH PUDU","RKL",4,4],

  ["171","HAB WIRA DAMAI","LEBUH AMPANG VIA SENTUL","RKL",7,6],

  ["173","TAMAN JASA UTAMA","LEBUH AMPANG","RKL",15,10],

  ["180","TAMAN DATO' SENU","HAB PASAR SENI","RKL",4,3],

  ["190","DESA SRI HARTAMAS","LIN HO JALAN LEKIU","RKL",9,9],

  ["202","HAB WIRA DAMAI","LEBUH AMPANG VIA GOMBAK","RKL",12,7],

  ["220","TAMAN MELAWATI","LEBUH AMPANG","RKL",7,5],

  ["222","TAMAN MELAWATI","STESEN LRT WANGSA MAJU","RKL",3,2],

  ["250","STESEN LRT WANGSA MAJU","LEBUH AMPANG","RKL",20,12],

  ["251","AU3 JENTAYU","CHOW KIT","RKL",6,5],

  ["302","TITIWANGSA","KLCC","RKL",3,3],

  ["772","SUBANG SURIA MAH SING","HAB PASAR SENI","RKL",10,7],

  ["780","KOTA DAMANSARA","HAB PASAR SENI","RKL",6,7],

  ["821","PANTAI HILL PARK","HAB PASAR SENI","RKL",10,7],

  ["822","STESEN LRT BANGSAR","BANGSAR SHOPPING CENTRE","RKL",2,2],

  ["BET16","WARTA BARU","PUTRAJAYA","RKL",2,"-"],

  ["BET17","PINGGIRAN BATU CAVES","PUTRAJAYA","RKL",1,"-"],

  ["MPS1","SELAYANG MUTIARA","STESEN LRT GOMBAK","RKL",4,4],

  ["MPS2A","LOTUS RAWANG","RAWANG PERDANA","RKL",3,3],

  ["MPS3","BATU ARANG","STESEN MRT SUNGAI BULOH","RKL",2,2],

  ["MPS4","WANGSA PERMAI","BANDAR BARU SELAYANG","RKL",2,2],

  ["T200","STESEN LRT GOMBAK","UIA GOMBAK","RKL",2,2],

  ["T201","STESEN LRT GOMBAK","HAB WIRA DAMAI","RKL",4,3],

  ["T202","STESEN LRT TAMAN MELATI","TAMAN MELEWAR","RKL",2,2],

  ["T222","STESEN LRT SRI RAMPAI","UKAY PERDANA","RKL",3,3],

  ["T250","STESEN LRT WANGSA MAJU","SETAPAK SENTRAL","RKL",5,3],

  ["T251","STESEN LRT SRI RAMPAI","SEKSYEN 10 WANGSA MAJU","RKL",2,2],


  ["T159B","STESEN KTM RAWANG","TAMAN GARING","ROD",2,2],

  ["T160B","BANDAR COUNTRY HOMES","STESEN KTM RAWANG","ROD",2,2],

  ["T173B","STESEN KTM BATU CAVES","HAB WIRA DAMAI","ROD",2,2],

  ["T202B","TAMAN MELATI","GOMBAK SETIA","ROD",4,3],

  ["T221B","LRT SRI RAMPAI","TAMAN MELAWATI","ROD",3,3],

  ["T252B","DANAU KOTA","JALAN GENTING KLANG","ROD",6,6],

  ["T253B","WANGSA MAJU","SRI RAMPAI","ROD",4,3],

  ["T254B","TITIWANGSA","CHOW KIT","ROD",4,3],

  ["T255B","BUKIT ANTARABANGSA","SETIAWANGSA","ROD",4,3],

  ["T821B","PANTAI SENTRAL","LRT UNIVERSITI","ROD",4,3],

  ["T850B","TAMAN BANDARAYA","BANGSAR","ROD",4,4],

  ["T200B","STESEN LRT GOMBAK","TAMAN SELASEH/IIUM","ROD",4,4],


  ["170","HAB WIRA DAMAI","STESEN MRT TITIWANGSA","OS",5,4],

  ["201","BATU 12 GOMBAK","STESEN MRT TITIWANGSA","OS",4,3],

  ["253","STESEN LRT WANGSA MAJU","AMPANG POINT","OS",3,2],

  ["254","AYER PANAS","TITIWANGSA VIA CHOW KIT","OS",3,2],

  ["851","HAB PASAR SENI","KOMPLEKS MAHKAMAH JALAN DUTA","OS",3,"-"]

];


let activeType = "ALL";


/* =========================
   GET STORAGE
========================= */

function getData(){

  try{

    return JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "{}"
    );

  }catch(error){

    return {};

  }

}


/* =========================
   SAVE DATA
========================= */

function saveData(route,los,pp,ac){

  const data = getData();

  data[route] = {
    los:los,
    pp:pp,
    ac:ac
  };

  data.lastUpdate =
    new Date().toISOString();

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================
   TYPE BADGE
========================= */

function typeBadge(type){

  let cls = "rkl";

  if(type === "ROD"){
    cls = "rod";
  }

  if(type === "OS"){
    cls = "os";
  }

  return `
    <span class="badge ${cls}">
      ${type}
    </span>
  `;

}


/* =========================
   RENDER TABLE
========================= */

function renderTable(){

  const data = getData();

  const tbody =
    document.getElementById("routeTable");

  tbody.innerHTML = "";


  routes.forEach((r,index)=>{

    const route = r[0];
    const origin = r[1];
    const destination = r[2];
    const type = r[3];

    const ppDefault = r[4];
    const acDefault = r[5];


    const saved =
      data[route] || {};


    const los =
      saved.los !== undefined
      ? saved.los
      : "-";


    const pp =
      saved.pp !== undefined
      ? saved.pp
      : ppDefault;


    const ac =
      saved.ac !== undefined
      ? saved.ac
      : acDefault;


    const row =
      document.createElement("tr");


    row.dataset.route = route;
    row.dataset.type = type;


    row.innerHTML = `

      <td>
        ${index + 1}
      </td>


      <td class="route">
        ${route}
      </td>


      <td>
        ${origin}
      </td>


      <td>
        ${destination}
      </td>


      <td>
        ${typeBadge(type)}
      </td>


      <td class="los value">
        ${los}
      </td>


      <td class="pp value">
        ${pp}
      </td>


      <td class="ac value">
        ${ac}
      </td>


      <td>

        <button
          class="action"
          onclick="editRoute(this)"
        >
          ✎ Kemaskini
        </button>

      </td>

    `;


    tbody.appendChild(row);

  });

}


/* =========================
   EDIT
========================= */

function editRoute(button){

  const row =
    button.closest("tr");


  const los =
    row.querySelector(".los")
      .textContent.trim();


  const pp =
    row.querySelector(".pp")
      .textContent.trim();


  const ac =
    row.querySelector(".ac")
      .textContent.trim();


  row.querySelector(".los").innerHTML = `

    <input
      class="number-input"
      type="number"
      min="0"
      value="${los === "-" ? "" : los}"
    >

  `;


  row.querySelector(".pp").innerHTML = `

    <input
      class="number-input"
      type="number"
      min="0"
      value="${pp === "-" ? "" : pp}"
    >

  `;


  row.querySelector(".ac").innerHTML = `

    <input
      class="number-input"
      type="number"
      min="0"
      value="${ac === "-" ? "" : ac}"
    >

  `;


  button.parentElement.innerHTML = `

    <button
      class="action save"
      onclick="saveRouteEdit(this)"
    >
      Simpan
    </button>


    <button
      class="action cancel"
      onclick="cancelRouteEdit(this)"
    >
      Batal
    </button>

  `;

}


/* =========================
   SAVE EDIT
========================= */

function saveRouteEdit(button){

  const row =
    button.closest("tr");


  const route =
    row.dataset.route;


  const losInput =
    row.querySelector(".los input").value.trim();


  const ppInput =
    row.querySelector(".pp input").value.trim();


  const acInput =
    row.querySelector(".ac input").value.trim();


  const los =
    losInput === ""
    ? "-"
    : Math.max(0,Number(losInput));


  const pp =
    ppInput === ""
    ? "-"
    : Math.max(0,Number(ppInput));


  const ac =
    acInput === ""
    ? "-"
    : Math.max(0,Number(acInput));


  row.querySelector(".los")
    .textContent = los;


  row.querySelector(".pp")
    .textContent = pp;


  row.querySelector(".ac")
    .textContent = ac;


  saveData(
    route,
    los,
    pp,
    ac
  );


  showLastUpdate();


  button.parentElement.innerHTML = `

    <button
      class="action"
      onclick="editRoute(this)"
    >
      ✎ Kemaskini
    </button>

  `;

}


/* =========================
   CANCEL
========================= */

function cancelRouteEdit(){

  renderTable();

  updateView();

}


/* =========================
   FILTER
========================= */

function filterRoutes(type,button){

  activeType = type;


  document
    .querySelectorAll(".tab")
    .forEach(tab=>{
      tab.classList.remove("active");
    });


  button.classList.add("active");


  updateView();

}


/* =========================
   SEARCH + COUNT
========================= */

function updateView(){

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let count = 0;


  document
    .querySelectorAll("#routeTable tr")
    .forEach(row=>{

      const typeMatch =
        activeType === "ALL" ||
        row.dataset.type === activeType;


      const searchMatch =
        row.innerText
          .toLowerCase()
          .includes(query);


      const show =
        typeMatch &&
        searchMatch;


      row.style.display =
        show ? "" : "none";


      if(show){
        count++;
      }

    });


  document
    .getElementById("routeCount")
    .textContent =
      count + " laluan";

}


/* =========================
   LAST UPDATE
========================= */

function showLastUpdate(){

  const data =
    getData();


  if(data.lastUpdate){

    document
      .getElementById("lastUpdate")
      .textContent =

      new Date(
        data.lastUpdate
      ).toLocaleString(
        "en-MY",
        {
          day:"numeric",
          month:"long",
          year:"numeric",
          hour:"numeric",
          minute:"2-digit",
          hour12:true
        }
      );

  }

}


/* =========================
   RUNNING DATE
========================= */

function showRunningDate(){

  document
    .getElementById("runningDate")
    .textContent =

    new Date().toLocaleDateString(
      "en-MY",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

}


/* =========================
   START
========================= */

renderTable();

showRunningDate();

showLastUpdate();

updateView();


</script>

</body>

</html>
